# Task-comment-to-Issue automation.
#
# Scans every push for real code task comments and keeps a matching
# GitHub Issue in sync automatically - created on a new one, updated if
# it changes, closed when the comment is removed from code. Each
# generated issue includes a permalink to the exact file/line plus a
# code snippet for context.
#
# Deliberately not spelling out the trigger comment's exact format or the
# action's optional reference syntax inline in this file - an earlier
# version did, and the action scanned its own illustrative examples as
# real trigger comments, creating five garbage issues. See the action's
# own README (alstr/todo-to-issue-action on GitHub) for exact syntax
# instead of duplicating it here where it can trigger itself.

name: "TODO to Issue"

on: ["push"]

jobs:
  build:
    runs-on: "ubuntu-latest"
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: "actions/checkout@v6"
      - name: "TODO to Issue"
        uses: "alstr/todo-to-issue-action@v5"
        with:
          CLOSE_ISSUES: "true"
          INSERT_ISSUE_URLS: "true"
